<div class="dimmer-modal climate-modal" id="climate-modal" style="display:none">
  <div class="dimmer-content climate-content">
    <div class="dimmer-header">
      <div class="dimmer-name" id="climate-name"></div>
      <button class="dimmer-close" id="climate-close-btn" aria-label="Close">✕</button>
    </div>
    <div class="climate-body">
      <div class="climate-current">
        <span class="climate-current-label">Now</span>
        <span class="climate-current-temp" id="climate-current-temp">--°</span>
      </div>
      <div class="climate-target">
        <button class="climate-temp-btn" id="climate-temp-down" aria-label="Decrease temperature">−</button>
        <div class="climate-target-temp" id="climate-target-temp">--°</div>
        <button class="climate-temp-btn" id="climate-temp-up" aria-label="Increase temperature">+</button>
      </div>
      <div class="climate-modes" id="climate-modes"></div>
    </div>
  </div>
</div>
