<div class="cover-modal" id="cover-modal" style="display:none">
  <div class="cover-content">
    <div class="cover-header">
      <div class="cover-name" id="cover-name"></div>
      <button class="cover-close" id="cover-close-btn" aria-label="Close">✕</button>
    </div>
    <div class="cover-body">
      <div class="cover-left" id="cover-left"></div>
      <div class="cover-slider-wrap">
        <div class="cover-track" id="cover-track">
          <div class="cover-fill" id="cover-fill"></div>
        </div>
      </div>
      <div class="cover-right">
        <button class="cover-btn-up" id="cover-btn-up" aria-label="Open">▲</button>
        <button class="cover-btn-stop" id="cover-btn-stop" aria-label="Stop">⏹</button>
        <button class="cover-btn-down" id="cover-btn-down" aria-label="Close">▼</button>
        <div class="cover-pos" id="cover-pos">0%</div>
      </div>
    </div>
  </div>
</div>
